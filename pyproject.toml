[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm"
version = "0.1.0"
description = "Secure File Manager: encrypted vault CLI (ICS0022 project)"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "bandit", "ruff", "mypy", "pip-audit"]

[project.scripts]
sfm = "sfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
